<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipAggregator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0e10;
            --navbar-bg: #18181b;
            --card-bg: #1f1f23;
            --text-main: #efeff1;
            --text-muted: #adadb8;
            --twitch-purple: #9146ff;
            --twitch-purple-hover: #a970ff;
            --border-color: #3a3a3d;
            --success-green: #2ea043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Top Navbar */
        header {
            background-color: var(--navbar-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--twitch-purple);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-group {
            display: flex;
            align-items: stretch;
            gap: 5px; 
            flex: 1;
            max-width: 850px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            background-color: var(--bg-color);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .search-container input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        /* NOVO: Contador Cinza de Clipes Encontrados */
        .clip-count-span {
            color: var(--text-muted);
            font-size: 0.85rem;
            align-self: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            margin-left: 8px;
            pointer-events: none;
        }

        .btn-reload {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .btn-reload:hover {
            border-color: var(--text-muted);
        }

        .btn-reload svg {
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            transform-origin: center;
        }

        .btn-reload.success {
            background-color: var(--success-green);
            border-color: var(--success-green);
            color: white;
        }

        .filters {
            display: flex;
            gap: 15px;
            border-left: 1px solid var(--border-color);
            padding-left: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-group input {
            accent-color: var(--twitch-purple);
            cursor: pointer;
        }

        .btn-stats {
            background-color: var(--twitch-purple);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-stats:hover {
            background-color: var(--twitch-purple-hover);
        }

        .sort-select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .sort-select:focus {
            border-color: var(--twitch-purple);
        }

        /* Main Grid */
        main {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .clip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #2b2b2f;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .card-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-category {
            color: var(--twitch-purple-hover);
            font-weight: 500;
            margin-top: 5px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 50px;
        }

        /* Modal / Pop-up */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--twitch-purple);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .modal-body {
            display: flex;
            gap: 30px;
        }

        .stats-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-box {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats-right {
            flex: 1.5;
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* NOVO: Header do Leaderboard com abas (Tabs) */
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .toggle-group {
            display: flex;
            gap: 5px;
            background-color: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            padding: 6px 10px;
            background-color: var(--card-bg);
            border-radius: 6px;
        }

        .lb-rank {
            font-weight: 700;
            color: var(--twitch-purple-hover);
            width: 25px;
        }

        .lb-name {
            flex: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lb-count {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .search-group {
                flex-direction: column;
                align-items: stretch;
            }
            .search-container {
                flex-direction: column;
                align-items: stretch;
            }
            .filters {
                border-left: none;
                border-top: 1px solid var(--border-color);
                padding-left: 0;
                padding-top: 10px;
                flex-wrap: wrap;
            }
            .clip-count-span {
                margin-left: 0;
                align-self: center;
                margin-top: 5px;
            }
            .btn-reload {
                padding: 10px;
            }
            .modal-body {
                flex-direction: column;
            }
            .leaderboard-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ClipAggregator</a>
        
        <div class="search-group">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar clipes...">
                <div class="filters">
                    <label class="checkbox-group">
                        <input type="checkbox" id="checkNome" checked> Nome do Clipe
                    </label>
                    <label class="checkbox-group">
                        <input type="checkbox" id="checkUser" checked> Usuário
                    </label>
                    <label class="checkbox-group">
                        <input type="checkbox" id="checkCat" checked> Categoria
                    </label>
                </div>
            </div>
            
            <button id="btnReload" class="btn-reload" title="Atualizar dados">
                <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="22px" height="22px">
                    <path d="M 15 3 C 12.031398 3 9.3028202 4.0834384 7.2070312 5.875 A 1.0001 1.0001 0 1 0 8.5058594 7.3945312 C 10.25407 5.9000929 12.516602 5 15 5 C 20.19656 5 24.450989 8.9379267 24.951172 14 L 22 14 L 26 20 L 30 14 L 26.949219 14 C 26.437925 7.8516588 21.277839 3 15 3 z M 4 10 L 0 16 L 3.0507812 16 C 3.562075 22.148341 8.7221607 27 15 27 C 17.968602 27 20.69718 25.916562 22.792969 24.125 A 1.0001 1.0001 0 1 0 21.494141 22.605469 C 19.74593 24.099907 17.483398 25 15 25 C 9.80344 25 5.5490109 21.062074 5.0488281 16 L 8 16 L 4 10 z"/>
                </svg>
            </button>

            <!-- NOVO: Onde a contagem de tempo ocioso será exibida -->
            <span id="clipCountSpan" class="clip-count-span"></span>
        </div>

        <button class="btn-stats" id="btnStats">Estatísticas</button>

        <select class="sort-select" id="sortSelect">
            <option value="default">Ordenação Padrão</option>
            <option value="views-desc">Mais Visualizações</option>
            <option value="views-asc">Menos Visualizações</option>
            <option value="date-desc">Mais Recentes</option>
            <option value="date-asc">Mais Antigos</option>
        </select>
    </header>

    <main>
        <div class="clip-grid" id="clipGrid">
            <div class="loader">Carregando clipes...</div>
        </div>
    </main>

    <!-- Modal de Estatísticas -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Estatísticas Gerais</div>
                <button class="close-modal" id="closeStats">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="stats-left">
                    <div class="stat-box">
                        <div class="stat-label">Total de Clipes</div>
                        <div class="stat-value" id="valTotalClips">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Tempo Total de Clipes</div>
                        <div class="stat-value" id="valTotalTime">00:00:00</div>
                    </div>
                </div>

                <div class="stats-right">
                    <!-- NOVO: Header interativo do Leaderboard -->
                    <div class="leaderboard-header">
                        <div class="leaderboard-title">Top 10</div>
                        <div class="toggle-group">
                            <button class="tab-btn active" id="tabClippers">Usuários</button>
                            <button class="tab-btn" id="tabCats">Categorias</button>
                        </div>
                    </div>
                    <ul class="leaderboard-list" id="leaderboardList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JSON_URL = 'https://gist.githubusercontent.com/ItsOnlyMe360/3d1b7ce8f62b6ada45c524accbdfaada/raw/';
        
        let allClips = [];

        // Elementos principais
        const clipGrid = document.getElementById('clipGrid');
        const searchInput = document.getElementById('searchInput');
        const checkNome = document.getElementById('checkNome');
        const checkUser = document.getElementById('checkUser');
        const checkCat = document.getElementById('checkCat');
        const sortSelect = document.getElementById('sortSelect');
        const btnReload = document.getElementById('btnReload');
        const reloadSvg = btnReload.querySelector('svg');
        const clipCountSpan = document.getElementById('clipCountSpan'); // Texto cinza de delay

        // Elementos do Modal
        const btnStats = document.getElementById('btnStats');
        const statsModal = document.getElementById('statsModal');
        const closeStats = document.getElementById('closeStats');
        const valTotalClips = document.getElementById('valTotalClips');
        const valTotalTime = document.getElementById('valTotalTime');
        const leaderboardList = document.getElementById('leaderboardList');
        
        // Elementos de aba (tabs)
        const tabClippers = document.getElementById('tabClippers');
        const tabCats = document.getElementById('tabCats');

        // Variáveis de escopo do rank
        let topClippersData = [];
        let topCatsData = [];
        let activeTab = 'clippers'; 
        let searchTimeout; // Timer do delay de pesquisa

        const getViewsStr = (clip) => clip.visualizacoes || clip.visualizações || clip.Visualizações || clip.Visualizacoes || clip.views || "0 visualizações";
        const getDateStr = (clip) => clip.data || clip.Data || clip.date || clip.Date || "Data desconhecida";
        const getNameStr = (clip) => clip.nome_do_clipe || clip.Nome || clip.title || "";
        const getUserStr = (clip) => clip.user_que_fez || clip.User || clip.creator || "Desconhecido";
        const getCatStr = (clip) => clip.categoria_do_clipe || clip.Categoria || clip.game || "";
        const getDurationStr = (clip) => clip.duracao_do_clipe || clip.duracao || "0:00";

        async function fetchClips(showLoader = true) {
            try {
                if (showLoader) {
                    clipGrid.innerHTML = `<div class="loader">Carregando clipes...</div>`;
                }

                const response = await fetch(JSON_URL);
                let data = await response.json();
                
                if (!Array.isArray(data)) {
                    data = [data];
                }
                
                allClips = data;
                renderAndFilterClips();
                return true; 
            } catch (error) {
                clipGrid.innerHTML = `<div class="loader" style="color: #ff4a4a;">Erro ao carregar os clipes.</div>`;
                console.error("Erro no fetch:", error);
                return false; 
            }
        }

        let currentRotation = 0;

        btnReload.addEventListener('click', async () => {
            btnReload.disabled = true;
            currentRotation += 720;
            reloadSvg.style.transform = `rotate(${currentRotation}deg)`;
            
            const success = await fetchClips(false); 
            
            if (success) {
                btnReload.classList.add('success'); 
                setTimeout(() => {
                    btnReload.classList.remove('success');
                    btnReload.disabled = false;
                }, 800); 
            } else {
                btnReload.disabled = false;
            }
        });

        function parseViews(viewsStr) {
            if (!viewsStr) return 0;
            let numStr = String(viewsStr).split(' ')[0].replace(',', '.');
            let num = parseFloat(numStr) || 0;
            if (viewsStr.toLowerCase().includes('mil')) num *= 1000;
            if (viewsStr.toLowerCase().includes('mi')) num *= 1000000;
            return num;
        }

        function parseDateWeight(dateStr) {
            if (!dateStr) return 0;
            let num = parseInt(String(dateStr).replace(/\D/g, '')) || 0;
            let weight = 0;
            let dLow = String(dateStr).toLowerCase();
            if (dLow.includes('ano')) weight = num * 365 * 24 * 60;
            else if (dLow.includes('mês') || dLow.includes('meses')) weight = num * 30 * 24 * 60;
            else if (dLow.includes('semana')) weight = num * 7 * 24 * 60;
            else if (dLow.includes('dia')) weight = num * 24 * 60;
            else if (dLow.includes('hora')) weight = num * 60;
            else if (dLow.includes('minuto')) weight = num;
            return weight; 
        }

        function getSecondsFromDuration(durStr) {
            if (!durStr) return 0;
            let parts = durStr.split(':').map(Number);
            if (parts.length === 2) return (parts[0] * 60) + parts[1];
            if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            return 0;
        }

        function formatTotalTime(totalSeconds) {
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        // NOVO: Renderiza a lista do leaderboard baseada na aba ativa
        function drawLeaderboard() {
            leaderboardList.innerHTML = '';
            let dataList = activeTab === 'clippers' ? topClippersData : topCatsData;

            if(dataList.length === 0) {
                leaderboardList.innerHTML = `<li class="leaderboard-item">Nenhum dado encontrado</li>`;
                return;
            }

            dataList.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `
                    <span class="lb-rank">${index + 1}</span>
                    <span class="lb-name">${item[0]}</span>
                    <span class="lb-count">${item[1]} clipes</span>
                `;
                leaderboardList.appendChild(li);
            });
        }

        function calculateAndShowStats() {
            valTotalClips.textContent = allClips.length;

            let totalSeconds = 0;
            let clippersCount = {};
            let catsCount = {};

            allClips.forEach(clip => {
                totalSeconds += getSecondsFromDuration(getDurationStr(clip));
                
                let user = getUserStr(clip).trim();
                if (user) clippersCount[user] = (clippersCount[user] || 0) + 1;

                let cat = getCatStr(clip).trim();
                if (cat) catsCount[cat] = (catsCount[cat] || 0) + 1;
            });

            valTotalTime.textContent = formatTotalTime(totalSeconds);

            topClippersData = Object.entries(clippersCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
            topCatsData = Object.entries(catsCount).sort((a, b) => b[1] - a[1]).slice(0, 10);

            drawLeaderboard();
        }

        btnStats.addEventListener('click', () => {
            calculateAndShowStats();
            statsModal.style.display = 'flex';
        });

        closeStats.addEventListener('click', () => {
            statsModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === statsModal) {
                statsModal.style.display = 'none';
            }
        });

        // Alternadores (Tabs)
        tabClippers.addEventListener('click', () => {
            activeTab = 'clippers';
            tabClippers.classList.add('active');
            tabCats.classList.remove('active');
            drawLeaderboard();
        });

        tabCats.addEventListener('click', () => {
            activeTab = 'cats';
            tabCats.classList.add('active');
            tabClippers.classList.remove('active');
            drawLeaderboard();
        });

        function renderAndFilterClips() {
            const searchTerm = searchInput.value.toLowerCase();
            const sortMode = sortSelect.value;
            
            let filteredClips = allClips.filter(clip => {
                if (searchTerm === '') return true;

                let matchNome = checkNome.checked && getNameStr(clip).toLowerCase().includes(searchTerm);
                let matchUser = checkUser.checked && getUserStr(clip).toLowerCase().includes(searchTerm);
                let matchCat = checkCat.checked && getCatStr(clip).toLowerCase().includes(searchTerm);

                return matchNome || matchUser || matchCat;
            });

            filteredClips.sort((a, b) => {
                if (sortMode === 'views-desc') {
                    return parseViews(getViewsStr(b)) - parseViews(getViewsStr(a));
                } else if (sortMode === 'views-asc') {
                    return parseViews(getViewsStr(a)) - parseViews(getViewsStr(b));
                } else if (sortMode === 'date-desc') {
                    return parseDateWeight(getDateStr(a)) - parseDateWeight(getDateStr(b));
                } else if (sortMode === 'date-asc') {
                    return parseDateWeight(getDateStr(b)) - parseDateWeight(getDateStr(a));
                }
                return 0; 
            });

            // NOVO: Lógica dos 3 Segundos Oculta/Exibe texto de contagem
            clipCountSpan.style.opacity = '0'; // Esconde na hora se alguma tecla for clicada
            clearTimeout(searchTimeout); // Zera o relógio para começar a contar do 0

            if (searchInput.value.trim() !== '') {
                // Se ainda tiver texto, ele espera 3 segundos 
                searchTimeout = setTimeout(() => {
                    clipCountSpan.textContent = `${filteredClips.length} encontrados`;
                    clipCountSpan.style.opacity = '1';
                }, 3000); // 3000ms = 3 segundos
            }

            clipGrid.innerHTML = '';
            
            if (filteredClips.length === 0) {
                clipGrid.innerHTML = `<div class="loader">Nenhum clipe encontrado.</div>`;
                return;
            }

            filteredClips.forEach(clip => {
                const thumb = clip.thumb_do_clipe || "https://via.placeholder.com/1920x1080/2b2b2f/efeff1?text=Sem+Thumbnail";
                const duracao = getDurationStr(clip);
                const link = clip.link || "#";

                const card = document.createElement('a');
                card.href = link;
                card.target = "_blank"; 
                card.className = 'card';

                // NOVO: Trocado "Clipper:" para "Clipado por:" 
                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${thumb}" alt="Thumbnail">
                        <span class="duration">${duracao}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${getNameStr(clip)}</div>
                        <div class="card-info">Clipado por: <strong>${getUserStr(clip)}</strong></div>
                        <div class="card-info">${getViewsStr(clip)} • ${getDateStr(clip)}</div>
                        <div class="card-category">${getCatStr(clip)}</div>
                    </div>
                `;
                clipGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', renderAndFilterClips);
        checkNome.addEventListener('change', renderAndFilterClips);
        checkUser.addEventListener('change', renderAndFilterClips);
        checkCat.addEventListener('change', renderAndFilterClips);
        sortSelect.addEventListener('change', renderAndFilterClips);

        // Init
        fetchClips();
    </script>
</body>
</html>
